[package]
name = "autolend-bitcoin"
version = "0.1.0"
edition = "2024"

[dependencies]
bdk = { version = "0.29.0", features = ["electrum", "compiler"] }
bitcoin = "0.30.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitcoincore-rpc = "0.17.0"
tokio = { version = "1", features = ["full"] }
dotenv = "0.15"
hex = "0.4"

[features]
regtest = []
